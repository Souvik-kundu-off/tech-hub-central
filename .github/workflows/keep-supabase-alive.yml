name: Keep Supabase Alive

# Runs every 4 days to prevent Supabase free-tier project from pausing
# Supabase pauses free projects after 7 days of inactivity
on:
  schedule:
    # Every 4 days at 06:00 UTC
    - cron: '0 6 */4 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          echo "Pinging Supabase to prevent inactivity pause..."
          
          # Simple health-check query via Supabase REST API
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Response status: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 206 ]; then
            echo "✅ Supabase is alive and responding!"
          else
            echo "❌ Supabase returned status $RESPONSE"
            exit 1
          fi

      - name: Log Timestamp
        run: echo "Keep-alive ping completed at $(date -u)"
